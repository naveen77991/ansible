- name: ansible to write a gather facts 
  hosts: web
  become: yes 
  tasks: 
   - name: ansible to write  
     ansible.builtin.debug: 
       msg: "{{ ansible_facts }}"  


   - name: ansible to install a pacckage based on os 
     ansible.builtin.package: 
       name: nginx
       state: present 
     when: ansible_facts.os_family=="RedHat"      

       
    